services:
  # ============================================
  # CACHE SERVICE
  # ============================================

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: music_redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - music_network
    restart: unless-stopped

  # ============================================
  # MESSAGE QUEUE SERVICE
  # ============================================

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: music_rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./backend/COMP1069-CNPMNC-BE/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - music_network
    restart: unless-stopped

  # ============================================
  # STORAGE SERVICE
  # ============================================

  # LocalStack (AWS S3 simulation)
  localstack:
    image: localstack/localstack:3.0
    container_name: music_localstack
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3
      DEBUG: 0
      LOCALSTACK_ENFORCE_AWS_HEADERS: 1
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    networks:
      - music_network
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import requests; requests.head("http://localhost:4566")',
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============================================
  # APPLICATION SERVICES
  # ============================================

  # Backend Node.js Application
  backend:
    build:
      context: ./backend/COMP1069-CNPMNC-BE
      dockerfile: Dockerfile
    container_name: music_backend
    ports:
      - '${PORT:-5000}:${PORT:-5000}'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      # Database
      MONGO_URI: ${MONGO_URI}
      # Redis
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      # RabbitMQ
      RABBITMQ_URL: ${RABBITMQ_URL}
      # AWS/LocalStack S3
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-music-uploads}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://localstack:4566}
      # JWT & Auth
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      # Client
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      # Cloudinary
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Jamendo API
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID}
      JAMENDO_API_KEY: ${JAMENDO_API_KEY}
      # Spotify API
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Email Service
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./backend/COMP1069-CNPMNC-BE/src:/app/src
      - ./backend/COMP1069-CNPMNC-BE/node_modules:/app/node_modules
    networks:
      - music_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:${PORT:-5000}', (r) => {if (r.statusCode !== 404) process.exit(0)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: music_frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:80/api # Trỏ về Nginx thay vì 5000 trực tiếp
      - VITE_APP_NAME=Music Web
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:5173', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - music_network
    restart: unless-stopped

  # ============================================
  # REVERSE PROXY
  # ============================================

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: music_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./backend/COMP1069-CNPMNC-BE/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_started # Đổi từ service_healthy sang service_started
      frontend:
        condition: service_started
    networks:
      - music_network
    restart: unless-stopped
    # image: nginx:alpine
    # container_name: music_nginx
    # ports:
    #   - '80:80'
    #   - '443:443'
    # volumes:
    #   - ./backend/COMP1069-CNPMNC-BE/nginx.conf:/etc/nginx/nginx.conf:ro
    #   - ./ssl:/etc/nginx/ssl:ro
    # depends_on:
    #   backend:
    #     condition: service_healthy
    #   frontend:
    #     condition: service_healthy
    # networks:
    #   - music_network
    # restart: unless-stopped
    # healthcheck:
    #   test:
    #     [
    #       'CMD',
    #       'wget',
    #       '--quiet',
    #       '--tries=1',
    #       '--spider',
    #       'http://localhost:80/health',
    #     ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s

  # ============================================
  # MONITORING & TOOLS
  # ============================================

  # Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: music_redis_commander
    ports:
      - '8082:8081'
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redis_password}
    depends_on:
      - redis
    networks:
      - music_network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  music_network:
    driver: bridge
