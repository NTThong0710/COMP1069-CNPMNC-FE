services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: music_redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - music_network
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: music_rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - music_network
    restart: unless-stopped

  # LocalStack (AWS S3 simulation)
  localstack:
    image: localstack/localstack:3.0
    container_name: music_localstack
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3
      DEBUG: 0
      LOCALSTACK_ENFORCE_AWS_HEADERS: 1
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    volumes:
      - ./localstack_init.sh:/docker-entrypoint-initaws.d/init.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - music_network
    healthcheck:
      test: ['CMD', 'awslocal', 's3', 'ls']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Backend Node.js Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music_backend
    ports:
      - '${PORT:-5000}:${PORT:-5000}'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      # Database
      MONGO_URI: ${MONGO_URI}
      # Redis
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      # RabbitMQ
      RABBITMQ_URL: ${RABBITMQ_URL}
      # AWS/LocalStack S3
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-music-uploads}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://localstack:4566}
      # JWT & Auth
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      # Client
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      # Cloudinary
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Jamendo API
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID}
      JAMENDO_API_KEY: ${JAMENDO_API_KEY}
      # Spotify API
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Email Service
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
    networks:
      - music_network
    restart: unless-stopped
    command: npm start

  # Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: music_redis_commander
    ports:
      - '8082:8081'
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redis_password}
    depends_on:
      - redis
    networks:
      - music_network
    restart: unless-stopped

  # ============================================
  # FRONTEND APPLICATION
  # ============================================

  # Frontend React Application
  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
    container_name: music_frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://backend:5000/api
      VITE_SOCKET_URL: http://backend:5000
      VITE_ENV: ${VITE_ENV:-development}
      VITE_DEBUG: ${VITE_DEBUG:-false}
      VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_SPOTIFY_CLIENT_ID: ${VITE_SPOTIFY_CLIENT_ID}
      VITE_APP_NAME: ${VITE_APP_NAME:-Music Web}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
      VITE_MAX_UPLOAD_SIZE: ${VITE_MAX_UPLOAD_SIZE:-52428800}
    depends_on:
      backend:
        condition: service_started
    networks:
      - music_network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5173']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # REVERSE PROXY
  # ============================================

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: music_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - music_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:80/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  music_network:
    driver: bridge
